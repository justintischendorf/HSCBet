# ============================================================
# Docker Compose – Production
#
# Enthält die komplette Anwendung (Web, API, Worker) inklusive
# Infrastruktur (Datenbank, Speicher, Queue) – für den Betrieb
# auf einem Server.
# ============================================================

name: hscbet-prod

services:
  # ----------------------------------------------------------
  # Next JS App
  # ----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_SERVER_URL: ${NEXT_PUBLIC_API_SERVER_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_AUTH_BASE_URL: ${NEXT_PUBLIC_AUTH_BASE_URL}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/hscbet.db
    ports:
      - "${WEB_SERVER_PORT:-3000}:3000"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      api:
        condition: service_started

  # ----------------------------------------------------------
  # Elysia App
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/hscbet.db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "${API_SERVER_PORT:-3001}:3001"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  # Datenbank-Migrationen
  # ----------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/hscbet.db
    working_dir: /app/packages/database
    entrypoint: ["bunx", "prisma", "migrate", "deploy"]
    volumes:
      - sqlite_data:/app/data

  # ----------------------------------------------------------
  # Worker
  # ----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  # ----------------------------------------------------------
  # MinIO Speicher
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------------
  # MinIO Initialisierung
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-junge-welt}
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo "Waiting for MinIO..."; sleep 2;
        done
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME
        echo "Bucket $$MINIO_BUCKET_NAME ready"

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

# ----------------------------------------------------------
# Named Volumes
# ----------------------------------------------------------
volumes:
  sqlite_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
