# ============================================================
# Docker Compose – Production
#
# Startet die komplette Anwendung (Web, API, Worker) inklusive
# Infrastruktur (Speicher, Queue) in Containern – für den
# Betrieb auf einem Server. Alle Werte kommen aus der .env im
# Projekt-Root.
#
# Die Ports sind nur auf 127.0.0.1 erreichbar. Nach außen geht
# es über einen Reverse Proxy mit HTTPS (siehe README,
# Abschnitt Deployment).
# ============================================================

name: hscbet-prod

services:
  # ----------------------------------------------------------
  # Next JS App
  # ----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_SERVER_URL: ${NEXT_PUBLIC_API_SERVER_URL:?NEXT_PUBLIC_API_SERVER_URL fehlt in .env}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL fehlt in .env}
        NEXT_PUBLIC_AUTH_BASE_URL: ${NEXT_PUBLIC_AUTH_BASE_URL:?NEXT_PUBLIC_AUTH_BASE_URL fehlt in .env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:./data/hscbet.db
    ports:
      - "127.0.0.1:${WEB_SERVER_PORT:-3000}:3000"
    volumes:
      - sqlite_data:/app/packages/database/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  # Elysia App
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: hscbet-prod-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:./data/hscbet.db
      API_SERVER_PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:${API_SERVER_PORT:-3001}:3001"
    volumes:
      - sqlite_data:/app/packages/database/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  # Datenbank-Migrationen (läuft bei jedem Start einmal durch)
  # ----------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: hscbet-prod-api
    environment:
      DATABASE_URL: file:./data/hscbet.db
    working_dir: /app/packages/database
    command: ["bunx", "prisma", "migrate", "deploy"]
    volumes:
      - sqlite_data:/app/packages/database/data

  # ----------------------------------------------------------
  # Worker
  # ----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: file:./data/hscbet.db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - sqlite_data:/app/packages/database/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # ----------------------------------------------------------
  # MinIO Speicher
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER fehlt in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD fehlt in .env}
    command: server /data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------------
  # MinIO Initialisierung
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER fehlt in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD fehlt in .env}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME fehlt in .env}
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo "Waiting for MinIO..."; sleep 2;
        done
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME
        echo "Bucket $$MINIO_BUCKET_NAME ready"

  # ----------------------------------------------------------
  # Redis (nur intern erreichbar, kein Passwort)
  # ----------------------------------------------------------
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data

# ----------------------------------------------------------
# Named Volumes
# ----------------------------------------------------------
volumes:
  sqlite_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
