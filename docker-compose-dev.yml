# ============================================================
# Docker Compose – Development
#
# Enthält nur die Infrastruktur (Datenbank, Speicher, Queue) und
# den Worker. Api und Web laufen im Dev-Betrieb lokal (bun run
# dev), damit Hot-Reload funktioniert.
# ============================================================

name: hscbet-dev

services:
  # ----------------------------------------------------------
  # MinIO Speicher
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------------
  # MinIO Initialisierung
  # ----------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-junge-welt}
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo "Waiting for MinIO..."; sleep 2;
        done
        mc mb --ignore-existing local/$$MINIO_BUCKET_NAME
        echo "Bucket $$MINIO_BUCKET_NAME ready"

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # ----------------------------------------------------------
  # Worker
  # ----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

# ----------------------------------------------------------
# Named Volumes
# ----------------------------------------------------------
volumes:
  minio_data:
    driver: local
  redis_data:
    driver: local
